title: Lababacy Apps
description: Practical, privacy-first iPhone tools by an independent developer.
url: "https://lababacy.com"
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from
collections:
  guides:
    output: true
    permalink: /guides/:name/
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: ""
      type: "guides"
    values:
      layout: "default"
